<div class="settings">
  <form class="pickers" hx-post="/c/{{ conversation.id }}/settings" hx-trigger="change"
        hx-target="#thinking-select" hx-swap="outerHTML">
    <select name="model" aria-label="Model">
      {% if conversation.model and conversation.model not in models %}
      <option value="{{ conversation.model }}" selected>{{ conversation.model }}</option>
      {% endif %}
      {% for model in models %}
      <option value="{{ model }}"{% if model == conversation.model %} selected{% endif %}>{{ model }}</option>
      {% endfor %}
      {% if not models and not conversation.model %}
      <option value="" selected>No models found</option>
      {% endif %}
    </select>
    {% include "partials/thinking_select.html" %}
  </form>
  {# Saved only with the Save button; app.js tracks unsaved changes. #}
  <details class="system-prompt">
    <summary>System prompt<span class="unsaved-mark" hidden> (unsaved)</span></summary>
    <form class="system-prompt-form" id="system-prompt-form"
          hx-post="/c/{{ conversation.id }}/system-prompt" hx-swap="none">
      <textarea name="system_prompt" rows="5" aria-label="System prompt" placeholder="You are a helpful assistant.">{{ conversation.system_prompt }}</textarea>
      <div class="system-prompt-actions">
        <span class="save-status" role="status"></span>
        <button class="action primary" type="submit" disabled>Save</button>
      </div>
    </form>
  </details>
</div>
